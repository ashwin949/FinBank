!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBank Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #0f172a;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .welcome {
            font-size: 15px;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .login-box p {
            color: #64748b;
            margin-bottom: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title p {
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .balance {
            font-size: 30px;
            font-weight: bold;
        }

        .account-number {
            font-size: 20px;
            font-weight: bold;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .action-box h2 {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .logout {
            width: auto;
            padding: 8px 15px;
            background: #dc2626;
        }

        .logout:hover {
            background: #b91c1c;
        }

        .transactions {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .transactions h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            color: #64748b;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 25px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 750px) {
            .cards,
            .actions {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 18px 20px;
            }

            .container {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->

    <div id="loginPage" class="login-box">

        <h1>FinBank</h1>

        <p>Login to access your banking dashboard.</p>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

    </div>


    <!-- DASHBOARD -->

    <div id="dashboardPage" class="hidden">

        <div class="navbar">

            <div class="logo">
                FinBank
            </div>

            <div class="welcome">
                Welcome to your dashboard
                <button class="logout" onclick="logout()">
                    Logout
                </button>
            </div>

        </div>


        <div class="container">

            <div class="title">

                <h1>Dashboard</h1>

                <p>
                    Manage your account and transactions.
                </p>

            </div>


            <!-- ACCOUNT CARDS -->

            <div class="cards">

                <div class="card">

                    <h3>
                        Available Balance
                    </h3>

                    <div
                        class="balance"
                        id="balance"
                    >
                        ₹0.00
                    </div>

                </div>


                <div class="card">

                    <h3>
                        Account Number
                    </h3>

                    <div
                        class="account-number"
                        id="accountNumber"
                    >
                        Loading...
                    </div>

                </div>
